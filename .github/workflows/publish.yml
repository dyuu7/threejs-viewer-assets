name: Release

on:
  schedule:
    - cron: '23 17 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact stable npm version on main; leave empty for latest'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: threejs-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'dyuu7/threejs-viewer-assets' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      revision: ${{ steps.pr.outputs.pull-request-head-sha || steps.prepare.outputs.revision }}
      promote: ${{ steps.pr.outputs.pull-request-head-sha != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prefer recovery of an unfinished release over another upstream update
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_REF: ${{ github.ref }}
        run: python scripts/release.py prepare --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.prepare.outputs.sync == 'true'
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.prepare.outputs.sync == 'true'
        with:
          version: '0.9.21'
          python-version: '3.12'
          enable-cache: true
      - if: steps.prepare.outputs.sync == 'true'
        run: npm ci --ignore-scripts
      - if: steps.prepare.outputs.sync == 'true'
        run: uv sync --locked
      - name: Synchronize official npm resources
        if: steps.prepare.outputs.sync == 'true'
        id: sync
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          uv run --locked python scripts/update_threejs.py
          --version "$REQUESTED_VERSION"
          --github-output "$GITHUB_OUTPUT"
          --report "$RUNNER_TEMP/threejs-update.md"
      - name: Refresh project lock metadata
        if: steps.sync.outputs.changed == 'true'
        run: uv lock
      - name: Open or update the upstream update PR
        id: pr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/update-threejs
          base: main
          title: 'chore(assets): update Three.js to ${{ steps.sync.outputs.version }}'
          commit-message: 'chore(assets): update Three.js to ${{ steps.sync.outputs.version }}'
          body-path: ${{ runner.temp }}/threejs-update.md
          add-paths: |
            src/threejs_viewer_assets/
            uv.lock
          delete-branch: true

  plan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable release and detect completed publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_PROMOTE: ${{ needs.prepare.outputs.promote }}
          RELEASE_EVENT_REF: ${{ github.ref }}
        run: python scripts/release.py plan --github-output "$GITHUB_OUTPUT"

  checks:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
    permissions:
      contents: read

  accept:
    needs: [prepare, plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Accept only the tested commit and create an immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ needs.plan.outputs.revision }}
          RELEASE_PROMOTE: ${{ needs.prepare.outputs.promote }}
        run: python scripts/release.py accept

  publish:
    needs: [plan, accept]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/threejs-viewer-assets
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions-${{ needs.plan.outputs.revision }}
          path: dist/
      - name: Verify existing PyPI files and stage only missing distributions
        id: stage
        run: python scripts/release.py stage --github-output "$GITHUB_OUTPUT"
      - name: Publish missing, previously verified distributions with OIDC
        if: steps.stage.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: pending/
      - name: Verify that PyPI holds both exact distributions
        run: python scripts/release.py verify

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions-${{ needs.plan.outputs.revision }}
          path: dist/
      - name: Complete the GitHub Release after confirming PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py github
