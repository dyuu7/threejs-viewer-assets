name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Use the commit timestamp for reproducible distributions
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.21'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: npm ci --ignore-scripts
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -m "not browser"
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked python scripts/check_dist.py
      - run: git diff --exit-code -- src/threejs_viewer_assets

  browser:
    name: Offline Chromium / installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Use the commit timestamp for reproducible distributions
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.21'
          python-version: '3.12'
          enable-cache: true
      - run: npm ci --ignore-scripts
      - run: uv sync --locked --group browser
      - run: uv run --locked --group browser playwright install --with-deps chromium
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked --group browser python scripts/check_dist.py --browser
      - run: git diff --exit-code -- src/threejs_viewer_assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ inputs.revision || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results-${{ inputs.revision || github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
