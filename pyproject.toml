[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "threejs-viewer-assets"
dynamic = ["version"]
description = "Offline Three.js WebGL core and selected viewer addons for Python applications"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dyuu7" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/dyuu7/threejs-viewer-assets"
Repository = "https://github.com/dyuu7/threejs-viewer-assets"
Issues = "https://github.com/dyuu7/threejs-viewer-assets/issues"

[dependency-groups]
dev = ["hatchling==1.27.0", "pytest>=8.3,<9", "ruff>=0.14,<1", "twine>=6,<7"]
browser = ["playwright>=1.55,<2"]

[tool.uv.dependency-groups]
browser = { requires-python = ">=3.10" }

[tool.hatch.version]
path = "src/threejs_viewer_assets/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/threejs_viewer_assets"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/scripts", "/tests", "/examples", "/docs", "/pyproject.toml", "/uv.lock",
  "/package.json", "/package-lock.json", "/.npmrc", "/.gitignore", "/README.md", "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: mandatory release browser tests (requires installed wheel and Chromium)"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
